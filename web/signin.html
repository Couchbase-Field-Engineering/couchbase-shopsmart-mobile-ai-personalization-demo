<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Couchbase ShopSmart</title>
<style>
  :root{--ink:#0d0f14;--ink2:#171a21;--line:#2a2e38;--text:#f4f5f7;--muted:#9aa1ae;--red:#EC1218;--red2:#c80f14}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1100px 520px at 50% -160px,#2a1114 0,var(--ink) 62%) var(--ink);
    display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:100%;max-width:400px}
  .mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;margin-bottom:26px}
  .dot{width:26px;height:26px;border-radius:50%;background:var(--red);position:relative;flex:none}
  .dot:after{content:"";position:absolute;inset:8px 6px;border-radius:3px;background:#fff}
  .eyebrow{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
  h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.4px;margin:8px 0 22px}
  form{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:22px}
  label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:6px}
  input{width:100%;font:inherit;color:var(--text);background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:16px;outline:none}
  input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(236,18,24,.22)}
  button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--red);border:0;border-radius:9px;padding:13px;cursor:pointer}
  button:hover{background:var(--red2)}
  button:focus-visible{outline:3px solid rgba(236,18,24,.45);outline-offset:2px}
  button[disabled]{opacity:.6;cursor:default}
  .err{min-height:22px;margin:0 0 12px;color:#ff8a8d;font-size:14px;font-weight:600}
  .foot{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="mark"><span class="dot" aria-hidden="true"></span>Couchbase</div>
  <div class="eyebrow">Demo environment</div>
  <h1>Couchbase ShopSmart</h1>
  <form id="f" autocomplete="on" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button id="b" type="submit">Sign in</button>
  </form>
  <p class="foot">Access is limited to Couchbase demo accounts.</p>
</main>
<script>
// The gate cookie is the SHA-256 of "<username>:<password>"; nginx compares it
// with the value it computed at start (web/demo-gate.sh). Nothing secret is in this page.
function sha256hex(str){
  var K=[],H=[],i,j,n=2,c=0;
  function frac(x){return ((x-Math.floor(x))*4294967296)|0}
  while(c<64){var p=true;for(i=2;i*i<=n;i++)if(n%i===0){p=false;break}
    if(p){if(c<8)H[c]=frac(Math.pow(n,1/2));K[c++]=frac(Math.pow(n,1/3))}n++}
  var b=Array.prototype.slice.call(new TextEncoder().encode(str)),l=b.length*8;
  b.push(128);while(b.length%64!==56)b.push(0);
  for(i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  function r(x,s){return (x>>>s)|(x<<(32-s))}
  for(var o=0;o<b.length;o+=64){
    var w=[],a=H.slice();
    for(i=0;i<64;i++){
      if(i<16)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
      else{var x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(r(x,7)^r(x,18)^(x>>>3))+w[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}
      var t1=(a[7]+(r(a[4],6)^r(a[4],11)^r(a[4],25))+((a[4]&a[5])^(~a[4]&a[6]))+K[i]+w[i])|0;
      var t2=((r(a[0],2)^r(a[0],13)^r(a[0],22))+((a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2])))|0;
      a=[(t1+t2)|0,a[0],a[1],a[2],(a[3]+t1)|0,a[4],a[5],a[6]];
    }
    for(j=0;j<8;j++)H[j]=(H[j]+a[j])|0;
  }
  return H.map(function(v){return ('00000000'+(v>>>0).toString(16)).slice(-8)}).join('');
}
(function(){
  var q=location.search,k=q.indexOf('next='),next=k<0?'/':q.slice(k+5)||'/';
  if(next.charAt(0)!=='/'||next.charAt(1)==='/'||next.charAt(1)==='\\'||next.indexOf('/signin')===0)next='/';
  var f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('b');
  function clear(){document.cookie='demo_gate=; Path=/; Max-Age=0; Secure; SameSite=Lax'}
  f.addEventListener('submit',function(e){
    e.preventDefault();err.textContent='';
    var u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
    if(!u||!p){err.textContent='Enter your username and password.';return}
    btn.disabled=true;
    document.cookie='demo_gate='+sha256hex(u+':'+p)+'; Path=/; Max-Age=43200; Secure; SameSite=Lax';
    fetch('/gate/check',{credentials:'same-origin',redirect:'manual',cache:'no-store'}).then(function(r){
      if(r.status===204){location.replace(next);return}
      clear();btn.disabled=false;err.textContent='Incorrect username or password.';
      document.getElementById('p').select();
    }).catch(function(){clear();btn.disabled=false;err.textContent='Could not reach the demo. Try again.'});
  });
})();
</script>
</body>
</html>
