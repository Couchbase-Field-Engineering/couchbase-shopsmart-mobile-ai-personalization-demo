# Sign-in gate. Every request needs the `demo_gate` cookie that /signin sets:
# the SHA-256 of "<username>:<password>". demo-gate.sh writes the expected
# value to /etc/nginx/demo-gate.map from DEMO_USERNAME / DEMO_PASSWORD when the
# container starts. The sign-in page, sign-out and the health check are public.
# The cookie value is 64 hex characters, longer than the default bucket.
map_hash_bucket_size 128;
map $uri $gate_public {
  default      0;
  /signin      1;
  /signout     1;
  /healthz     1;
  /favicon.ico 1;
}
map "$gate_public:$cookie_demo_gate" $gate_denied {
  default 1;
  "~^1:"  0;
  include /etc/nginx/demo-gate.map;
}

server {
  # HTTPS only. The certificate in /etc/nginx/tls is mounted, or generated
  # (self-signed) by demo-gate.sh on first start.
  listen 443 ssl;
  ssl_certificate     /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  # Plain http:// on this port is sent to https:// on the same host and port.
  error_page 497 =307 https://$http_host$request_uri;
  # The published port differs from 443, so redirects must stay relative.
  absolute_redirect off;

  if ($gate_denied) {
    return 302 /signin?next=$request_uri;
  }
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  location = /signin {
    add_header Cache-Control "no-store";
    try_files /signin.html =404;
  }
  location = /signout {
    add_header Set-Cookie "demo_gate=; Path=/; Max-Age=0; Secure; SameSite=Lax";
    return 302 /signin;
  }
  # Asked by the sign-in page after it sets the cookie: 204 = accepted.
  location = /gate/check {
    add_header Cache-Control "no-store";
    return 204;
  }
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The web build calls the backend on its own origin (EXPO_PUBLIC_API_URL=same-origin),
  # so one URL serves the app in Docker Compose and in Kubernetes. `backend` is the
  # compose service name and the Kubernetes Service name.
  location /api/ {
    proxy_pass http://backend:8200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # The story that opens the demo (offline-first shopping, and how Couchbase takes the per-request load off Databricks).
  location = /story {
    try_files /story.html =404;
  }

  # The merchandising console: live pricing rules, bundles and the levers that move them.
  location = /merch {
    try_files /merch.html =404;
  }

  # expo-router routes (/login, /product, ...) are client-side: fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
