apiVersion: v2
name: shopsmart-app
description: >-
  Couchbase ShopSmart mobile AI personalization demo on Kubernetes: Couchbase
  Server (shopper profiles and recommendations from the daily Databricks export),
  Sync Gateway (Couchbase Lite replication for shoppers' phones), the backend (FastAPI + the shopsmart-shopping MCP
  server, which registers itself with the Couchbase Agent Operations Manager),
  the app in a browser, and a daily CronJob that drops a new mock Databricks
  export.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords: [couchbase, couchbase-lite, sync-gateway, mcp, rag, offline-first, databricks, retail, personalization]
